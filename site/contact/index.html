<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="meta.title">Spinfinity — Contact (bientôt)</title>
<meta name="description" content="Page Contact de Spinfinity — bientôt disponible." data-i18n-attr="content" data-i18n="meta.description">
<meta name="theme-color" content="#0a0a14">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://spinfinity.app/contact/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
:root {
    --bg-1: #0a0a14;
    --text: #ffffff;
    --text-dim: #d4cce0;
    --text-faded: #8a809f;
    --purple: #a855f7;
    --pink: #ec4899;
    --gold: #fde047;
    --cyan: #00f0ff;
    --border-glass: rgba(255,255,255,0.08);
    --bg-glass: rgba(255,255,255,0.04);
}
body {
    font-family: 'Manrope', system-ui, sans-serif;
    color: var(--text);
    background: var(--bg-1);
    min-height: 100vh;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
}
body::before {
    content: ''; position: fixed; inset: 0;
    background:
        radial-gradient(circle at 12% 8%, rgba(168,85,247,0.20) 0%, transparent 45%),
        radial-gradient(circle at 88% 25%, rgba(236,72,153,0.16) 0%, transparent 50%),
        radial-gradient(circle at 50% 90%, rgba(0,240,255,0.12) 0%, transparent 55%),
        var(--bg-1);
    z-index: -1;
    pointer-events: none;
}
.top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: rgba(10,10,20,0.65);
    border-bottom: 1px solid var(--border-glass);
}
.back-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px; font-weight: 600;
    transition: background .2s, color .2s, transform .15s;
}
.back-link:hover { background: rgba(168,85,247,0.18); color: var(--text); transform: translateX(-2px); }
.back-link svg { width: 16px; height: 16px; }
.brand {
    font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, #fff, var(--purple), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: -0.01em;
}
.lang-switch { display: flex; gap: 4px; }
.lang-btn {
    padding: 6px 12px;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--border-glass);
    color: var(--text-faded);
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.06em;
    transition: background .2s, color .2s;
}
.lang-btn.active { background: var(--text); color: var(--bg-1); border-color: var(--text); }

main {
    flex: 1;
    display: flex;
    align-items: center; justify-content: center;
    padding: 60px 24px;
}
.soon {
    max-width: 540px; text-align: center;
    animation: rise 0.7s ease-out both;
}
.soon-icon {
    width: 86px; height: 86px;
    margin: 0 auto 26px;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(168,85,247,0.20), rgba(236,72,153,0.20));
    border: 1px solid rgba(168,85,247,0.45);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 48px rgba(168,85,247,0.25);
    position: relative;
    overflow: hidden;
}
.soon-icon svg { width: 42px; height: 42px; color: var(--purple); }
.soon-icon::after {
    content: ''; position: absolute; inset: -2px;
    border-radius: 22px;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(168,85,247,0.6) 80deg, transparent 160deg);
    animation: spin 4s linear infinite;
    z-index: -1;
}
.soon-eyebrow {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(253,224,71,0.10);
    border: 1px solid rgba(253,224,71,0.35);
    color: var(--gold);
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    margin-bottom: 18px;
}
h1 {
    font-size: clamp(34px, 6vw, 52px);
    font-weight: 800;
    margin: 0 0 16px;
    letter-spacing: -0.025em;
    line-height: 1.1;
}
h1 .accent {
    background: linear-gradient(135deg, var(--gold), var(--pink), var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
}
.soon p {
    color: var(--text-dim);
    font-size: 16px;
    margin: 0 0 32px;
    line-height: 1.65;
}
.cta-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.cta {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 24px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700; font-size: 14px;
    transition: transform .15s, box-shadow .25s, background .2s;
}
.cta.primary {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: #fff;
    box-shadow: 0 10px 30px rgba(168,85,247,0.4);
}
.cta.primary:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(168,85,247,0.55); }
.cta.ghost {
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    color: var(--text-dim);
}
.cta.ghost:hover { background: rgba(168,85,247,0.18); color: var(--text); transform: translateY(-2px); }
.cta svg { width: 16px; height: 16px; }

footer {
    padding: 30px 24px;
    text-align: center;
    color: var(--text-faded);
    font-size: 12.5px;
    border-top: 1px solid var(--border-glass);
}
footer .links { display: flex; justify-content: center; gap: 18px; margin-top: 8px; flex-wrap: wrap; }
footer a { color: var(--text-faded); text-decoration: none; transition: color .2s; }
footer a:hover { color: var(--text); }

@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
    .soon { animation: none; }
    .soon-icon::after { animation: none; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ic-back" viewBox="0 0 24 24"><path d="M14 6 L8 12 L14 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-arrow" viewBox="0 0 24 24"><path d="M5 12 L19 12 M13 6 L19 12 L13 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-cone" viewBox="0 0 24 24">
      <path d="M12 3 L21 19 L3 19 Z" fill="currentColor" opacity="0.15"/>
      <path d="M12 3 L21 19 L3 19 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <line x1="7" y1="11" x2="17" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="6" y1="15" x2="18" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="9" r="1" fill="currentColor"/>
    </symbol>
  </defs>
</svg>
</head>
<body>

<header class="top-bar">
    <a href="../" class="back-link" data-testid="back-home">
        <svg><use href="#ic-back"/></svg>
        <span data-i18n="nav.home">Accueil</span>
    </a>
    <div class="brand">Spinfinity</div>
    <div class="lang-switch">
        <button class="lang-btn" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="en">EN</button>
    </div>
</header>

<main>
    <div class="soon">
        <div class="soon-icon"><svg><use href="#ic-cone"/></svg></div>
        <span class="soon-eyebrow" data-i18n="eyebrow">Bientôt</span>
        <h1><span data-i18n="title.start">Page</span> <span class="accent" data-i18n="title.accent">en construction</span></h1>
        <p data-i18n="lead">Cette page sera bientôt disponible. En attendant, lance un tirage ou consulte le guide d'utilisation.</p>
        <div class="cta-row">
            <a href="../" class="cta primary" data-testid="cta-home">
                <span data-i18n="cta.home">Lancer un tirage</span>
                <svg><use href="#ic-arrow"/></svg>
            </a>
            <a href="../help/" class="cta ghost" data-testid="cta-help">
                <span data-i18n="cta.help">Comment ça marche ?</span>
            </a>
        </div>
    </div>
</main>

<script src="../_shared/footer.js" defer></script>

<script>
const I18N = {
    fr: {
        'meta.title':       'Spinfinity — Contact (bientôt)',
        'meta.description': 'Page Contact de Spinfinity — bientôt disponible.',
        'nav.home':         'Accueil',
        'eyebrow':          'Bientôt',
        'title.start':      'Page',
        'title.accent':     'en construction',
        'lead':             "Cette page sera bientôt disponible. En attendant, lance un tirage ou consulte le guide d'utilisation.",
        'cta.home':         'Lancer un tirage',
        'cta.help':         'Comment ça marche ?',
        'footer.copy':      '© 2026 Spinfinity — Tirage au sort avec style',
        'footer.about':     'À propos',
        'footer.legal':     'Mentions légales',
        'footer.contact':   'Contact'
    },
    en: {
        'meta.title':       'Spinfinity — Contact (soon)',
        'meta.description': 'Spinfinity Contact page — coming soon.',
        'nav.home':         'Home',
        'eyebrow':          'Soon',
        'title.start':      'Page',
        'title.accent':     'under construction',
        'lead':             "This page will be available shortly. In the meantime, run a draw or check the user guide.",
        'cta.home':         'Run a draw',
        'cta.help':         'How does it work?',
        'footer.copy':      '© 2026 Spinfinity — Random draws with style',
        'footer.about':     'About',
        'footer.legal':     'Legal notice',
        'footer.contact':   'Contact'
    }
};
function detectLanguage() {
    const url = new URLSearchParams(location.search).get('lang');
    if (url === 'fr' || url === 'en') return url;
    const stored = localStorage.getItem('spinfinity-lang');
    if (stored === 'fr' || stored === 'en') return stored;
    return (navigator.language || 'fr').toLowerCase().startsWith('en') ? 'en' : 'fr';
}
function applyLanguage(lang) {
    const dict = I18N[lang] || I18N.fr;
    document.documentElement.lang = lang;
    localStorage.setItem('spinfinity-lang', lang);
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        const attr = el.dataset.i18nAttr;
        if (dict[key] !== undefined) {
            if (attr) el.setAttribute(attr, dict[key]);
            else el.textContent = dict[key];
        }
    });
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });
}
document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
});
applyLanguage(detectLanguage());
</script>
</body>
</html>
