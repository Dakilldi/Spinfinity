<script defer src="../_shared/replay.js"></script>

<style>
:root {
    --bg-1: #0e0620;
    --bg-2: #1a0a2e;
    --panel: #23103f;

    --purple: #a855f7;
    --purple-deep: #7c3aed;
    --purple-light: #c084fc;
    --pink: #ec4899;
    --pink-deep: #be185d;
    --pink-light: #f472b6;
    --gold: #fbbf24;
    --gold-bright: #fde047;
    --stage-red: #ef4444;

    --border: rgba(168,85,247,0.25);
    --border-soft: rgba(255,255,255,0.08);
    --text: #faf5ff;
    --text-dim: #d8b4fe;
    --text-faded: #8b6bb3;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg-1); color: var(--text); font-family: 'Manrope', sans-serif; overflow-x: hidden; }
body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse 900px 500px at 50% 0%, rgba(168,85,247,0.22), transparent 60%),
        radial-gradient(ellipse 700px 400px at 20% 80%, rgba(236,72,153,0.15), transparent 60%),
        radial-gradient(ellipse 500px 300px at 80% 80%, rgba(251,191,36,0.1), transparent 60%),
        linear-gradient(180deg, #0e0620 0%, #1a0a2e 100%);
    padding: 0 12px 40px;
    text-align: center;
}

/* Sweeping spotlights in background */
body::before {
    content: ''; position: fixed; inset: -10% -10%;
    background:
        radial-gradient(ellipse 40% 80% at 20% 100%, rgba(168,85,247,0.15), transparent 60%),
        radial-gradient(ellipse 40% 80% at 80% 100%, rgba(236,72,153,0.15), transparent 60%);
    pointer-events: none; z-index: 1;
    animation: stageSweep 8s ease-in-out infinite;
}
@keyframes stageSweep {
    0%, 100% { transform: skewX(-5deg) translateX(-20px); }
    50%      { transform: skewX(5deg) translateX(20px); }
}
/* Velvet curtain pattern */
body::after {
    content: ''; position: fixed; inset: 0;
    background-image:
        repeating-linear-gradient(90deg,
            rgba(255,255,255,0) 0px,
            rgba(255,255,255,0) 38px,
            rgba(168,85,247,0.03) 38px,
            rgba(168,85,247,0.03) 40px
        );
    pointer-events: none; z-index: 1;
}

.top-nav {
    position: sticky; top: 0; z-index: 60;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; margin: 0 -12px 0 -12px;
    background: rgba(14,6,32,0.78);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
}
.back-home {
    display: flex; align-items: center; gap: 10px;
    color: var(--text); text-decoration: none; font-weight: 700;
    font-size: 16px; letter-spacing: -0.01em;
    padding: 6px 12px; border-radius: 10px;
    transition: background 0.2s ease;
}
.back-home:hover { background: rgba(168,85,247,0.1); }
.back-home svg { width: 18px; height: 18px; }
.back-home .label { display: inline; }
.lang-switch {
    display: flex; gap: 4px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border-soft);
    border-radius: 100px; padding: 4px;
}
.lang-btn {
    background: transparent; border: none; color: var(--text-dim);
    padding: 6px 14px; border-radius: 100px;
    font-family: inherit; font-weight: 600; font-size: 12px;
    cursor: pointer; transition: all 0.2s ease;
}
.lang-btn.active {
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: white;
}
.lang-btn:not(.active):hover { color: var(--purple-light); }

#smoke-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
#confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

.container { position: relative; z-index: 10; max-width: 900px; margin: 0 auto; padding-top: 20px; }

/* ---------- LIVE badge ---------- */
.live-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 6px;
    background: var(--stage-red);
    color: white;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px; font-weight: 400;
    letter-spacing: 0.3em;
    margin-bottom: 18px;
    box-shadow: 0 0 20px rgba(239,68,68,0.5);
}
.live-badge::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: white;
    box-shadow: 0 0 10px white;
    animation: livePulse 1.4s ease-in-out infinite;
}
@keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

/* ---------- TITLE ---------- */
h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 11vw, 110px);
    letter-spacing: 0.04em; line-height: 0.9;
    margin: 10px 8px 15px; padding: 0 8px;
    color: var(--text);
    display: flex; align-items: center; justify-content: center; gap: 0.25em;
    flex-wrap: wrap;
}
h1 .accent {
    background: linear-gradient(135deg, var(--purple-light) 0%, var(--pink-light) 50%, var(--gold) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    text-shadow:
        0 0 40px rgba(168,85,247,0.6),
        0 0 80px rgba(236,72,153,0.3);
    animation: titleGlow 4s ease-in-out infinite;
}
@keyframes titleGlow {
    0%,100% { filter: brightness(1); }
    50%     { filter: brightness(1.2) drop-shadow(0 0 20px rgba(168,85,247,0.6)); }
}
h1 .star {
    display: inline-block;
    filter: drop-shadow(0 0 15px var(--gold));
    animation: starTwinkle 2s ease-in-out infinite;
}
h1 .star.right { animation-delay: 1s; }
@keyframes starTwinkle {
    0%,100% { transform: rotate(-10deg) scale(1); opacity: 1; }
    50%     { transform: rotate(10deg) scale(1.1); opacity: 0.7; }
}

.subtitle {
    font-family: 'Poppins', sans-serif;
    color: var(--text-dim); font-size: clamp(14px, 2vw, 17px);
    font-weight: 600;
    margin-bottom: 35px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.8;
}

/* ---------- SLOT — neon stage ---------- */
.wheel-wrapper { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px; margin: 25px auto; position: relative; }
.slot-container {
    position: relative; z-index: 10;
    padding: 16px;
    border-radius: 24px;
    background: linear-gradient(145deg, var(--purple) 0%, var(--pink) 50%, var(--pink-deep) 100%);
    box-shadow:
        0 0 40px rgba(168,85,247,0.5),
        0 0 80px rgba(236,72,153,0.3),
        0 20px 50px rgba(0,0,0,0.6),
        inset 0 2px 0 rgba(255,255,255,0.3);
}
/* Marquee bulbs */
.bulb-row { position: absolute; display: flex; justify-content: space-around; pointer-events: none; z-index: 3; }
.bulb-row.top    { top: 3px; left: 16px; right: 16px; }
.bulb-row.bottom { bottom: 3px; left: 16px; right: 16px; }
.bulb-row.left   { top: 16px; bottom: 16px; left: 3px; flex-direction: column; }
.bulb-row.right  { top: 16px; bottom: 16px; right: 3px; flex-direction: column; }
.bulb {
    width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle, #fff 20%, var(--gold-bright) 60%, var(--gold) 100%);
    box-shadow: 0 0 8px var(--gold-bright);
    animation: bulbChase 1.2s linear infinite;
}
@keyframes bulbChase {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px var(--gold-bright); }
    50%      { opacity: 0.35; transform: scale(0.65); box-shadow: 0 0 3px var(--gold-bright); }
}

.slot {
    position: relative; width: min(560px, 84vw); height: 320px;
    border: 2px solid rgba(0,0,0,0.4);
    border-radius: 12px;
    background:
        linear-gradient(180deg, #1a0a2e 0%, #0e0620 50%, #1a0a2e 100%);
    box-shadow:
        inset 0 0 60px rgba(0,0,0,0.9),
        inset 0 0 100px rgba(168,85,247,0.15);
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 22%, rgba(0,0,0,1) 78%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 22%, rgba(0,0,0,1) 78%, rgba(0,0,0,0) 100%);
}

/* Moving spotlights inside the slot during spin */
.slot::before {
    content: ''; position: absolute; inset: 0;
    background:
        radial-gradient(ellipse 50% 100% at 30% 50%, rgba(168,85,247,0.25), transparent 60%),
        radial-gradient(ellipse 50% 100% at 70% 50%, rgba(236,72,153,0.25), transparent 60%);
    opacity: 0.6;
    pointer-events: none;
    z-index: 2;
    transition: opacity 0.3s ease;
}
.slot.spinning::before {
    animation: spotlightSweep 0.8s linear infinite;
    opacity: 1;
}
@keyframes spotlightSweep {
    0%   { background-position: -50% 0, 150% 0; }
    100% { background-position: 150% 0, -50% 0; }
}

.slot.winner-glow {
    border-color: var(--gold-bright);
    animation: winnerStrobe 0.5s ease-in-out infinite;
}
@keyframes winnerStrobe {
    0%, 100% { box-shadow: inset 0 0 60px rgba(0,0,0,0.9), inset 0 0 100px rgba(251,191,36,0.3), 0 0 40px rgba(251,191,36,0.4); }
    50%      { box-shadow: inset 0 0 60px rgba(0,0,0,0.9), inset 0 0 120px rgba(251,191,36,0.6), 0 0 80px rgba(251,191,36,0.7); }
}

.reel { position: absolute; top: 0; left: 0; right: 0; will-change: transform; z-index: 3; }
.reel-item {
    height: 100px; line-height: 100px;
    font-family: 'Bebas Neue', sans-serif; font-weight: 400;
    font-size: clamp(32px, 5.5vw, 54px);
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 0 18px; letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(168,85,247,0.4);
}
.highlight {
    position: absolute; left: 0; right: 0; top: 50%; height: 100px;
    transform: translateY(-50%);
    border-top: 3px solid var(--gold-bright);
    border-bottom: 3px solid var(--gold-bright);
    background:
        linear-gradient(180deg, transparent, rgba(251,191,36,0.06), transparent);
    box-shadow:
        inset 0 0 30px rgba(251,191,36,0.2),
        0 0 20px rgba(251,191,36,0.5);
    pointer-events: none; z-index: 4;
}
.winner-glow .reel-item.winning {
    color: var(--gold-bright);
    text-shadow:
        0 0 20px var(--gold-bright),
        0 0 40px var(--pink-light),
        0 0 60px var(--purple);
    animation: winText 1s ease-in-out infinite;
}
@keyframes winText {
    0%,100% { transform: scale(1); letter-spacing: 2px; }
    50%     { transform: scale(1.08); letter-spacing: 4px; }
}

.ready {
    text-align: center; font-family: 'Bebas Neue', sans-serif;
    color: var(--purple-light); font-size: 46px; line-height: 320px;
    letter-spacing: 10px;
    text-shadow: 0 0 20px var(--purple), 0 0 40px var(--pink);
    animation: readyBreathe 2s ease-in-out infinite;
}
@keyframes readyBreathe { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

/* ---------- APPLAUSE-O-METER (replaces RPM) ---------- */
.applause-meter {
    position: relative;
    width: min(460px, 82vw);
    min-height: 92px;
    background:
        linear-gradient(180deg, #0e0620 0%, #1a0a2e 100%);
    border: 2px solid var(--purple);
    border-radius: 16px;
    padding: 12px 16px 14px;
    flex-shrink: 0;
    box-shadow:
        0 0 25px rgba(168,85,247,0.3),
        inset 0 0 30px rgba(0,0,0,0.7),
        0 10px 25px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; gap: 6px;
}
.applause-meter .label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--gold-bright);
    text-shadow: 0 0 8px var(--gold);
    text-align: left;
}
.bar-wrap {
    position: relative;
    width: 100%;
    height: 28px;
    background: rgba(0,0,0,0.4);
    border-radius: 6px;
    border: 1px solid rgba(168,85,247,0.25);
    overflow: hidden;
}
.bar-fill {
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 15%;
    background: linear-gradient(90deg,
        var(--purple) 0%,
        var(--pink) 35%,
        var(--gold) 65%,
        var(--stage-red) 100%);
    transition: width 0.08s linear;
    box-shadow:
        2px 0 10px rgba(168,85,247,0.4),
        inset 0 1px 0 rgba(255,255,255,0.3);
    border-radius: 4px;
}
/* Tick marks horizontal */
.bar-wrap::before {
    content: '';
    position: absolute; inset: 0;
    background:
        repeating-linear-gradient(90deg,
            transparent 0,
            transparent 14px,
            rgba(255,255,255,0.06) 14px,
            rgba(255,255,255,0.06) 15px
        );
    pointer-events: none;
    z-index: 2;
}
.bar-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 0.15em;
    color: var(--text);
    text-shadow: 0 0 8px var(--purple);
    text-align: right;
}

/* ---------- PRIZE BANNER ---------- */
.prize-banner {
    max-width: 700px; margin: 0 auto; padding: 0 20px;
    max-height: 0; opacity: 0; overflow: hidden;
    pointer-events: none; text-align: center;
    transition: max-height 0.5s ease, opacity 0.5s ease, margin 0.5s ease, padding 0.5s ease;
}
.prize-banner.visible {
    max-height: 260px; margin: 20px auto; padding: 28px 30px; opacity: 1;
    background: linear-gradient(135deg, rgba(168,85,247,0.18), rgba(236,72,153,0.18), rgba(251,191,36,0.12));
    border: 2px solid var(--gold-bright);
    border-radius: 18px;
    box-shadow:
        0 0 50px rgba(168,85,247,0.4),
        0 0 100px rgba(236,72,153,0.3);
    transition: max-height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease, margin 0.5s ease, padding 0.5s ease;
}
.prize-banner.fading {
    opacity: 0; max-height: 0; margin: 0 auto; padding: 0 20px;
    transition: opacity 1.2s ease, max-height 1.2s ease, margin 1.2s ease, padding 1.2s ease;
}
.prize-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(15px, 2.5vw, 20px);
    color: var(--text); letter-spacing: 0.3em;
    text-shadow: 0 0 10px var(--gold);
    margin-bottom: 14px;
}
.prize-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(30px, 6vw, 56px);
    color: var(--gold-bright);
    text-shadow:
        0 0 20px var(--gold-bright),
        0 0 40px var(--pink),
        0 0 60px var(--purple);
    letter-spacing: 3px; line-height: 1;
    animation: prizePulse 1.2s ease-in-out infinite;
}
@keyframes prizePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ---------- START BUTTON ---------- */
.start-btn-wrapper { margin: 30px auto; }
.start-btn {
    display: inline-flex; align-items: center; gap: 16px;
    padding: 20px 50px;
    background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 60%, var(--stage-red) 100%);
    border: 3px solid rgba(0,0,0,0.3);
    border-radius: 100px;
    color: white;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(20px, 3.2vw, 28px);
    letter-spacing: 3px;
    cursor: pointer; position: relative;
    box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.4),
        inset 0 -6px 12px rgba(0,0,0,0.3),
        0 10px 30px rgba(168,85,247,0.5),
        0 0 60px rgba(236,72,153,0.3);
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    transition: transform 0.08s ease, box-shadow 0.2s ease, filter 0.2s ease;
    text-transform: uppercase;
}
.start-btn:hover:not(:disabled) {
    box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.4),
        inset 0 -6px 12px rgba(0,0,0,0.3),
        0 12px 40px rgba(168,85,247,0.7),
        0 0 80px rgba(236,72,153,0.5);
    filter: brightness(1.1);
}
.start-btn:active:not(:disabled) { transform: translateY(3px); }
.start-btn:disabled { opacity: 0.55; cursor: not-allowed; filter: grayscale(0.4); }
.start-btn .led {
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, var(--gold-bright) 70%);
    box-shadow: 0 0 12px var(--gold-bright), inset 0 -2px 3px rgba(0,0,0,0.3);
    animation: ledBlink 1.4s ease-in-out infinite;
}
@keyframes ledBlink { 0%,100% { opacity: 1; filter: brightness(1.2); } 50% { opacity: 0.4; filter: brightness(0.7); } }
.start-btn.active .led { animation: ledBlink 0.25s ease-in-out infinite; }

#audio-status {
    display: none;
    font-family: 'Bebas Neue', sans-serif; font-size: 13px;
    opacity: 0.6; letter-spacing: 0.15em;
    margin: 0 auto 15px; color: var(--purple-light);
    text-transform: uppercase;
}

/* ---------- REPLAY CTA ---------- */
.replay-cta {
    display: none;
    margin: 0 auto 25px;
    align-items: center; gap: 10px;
    padding: 12px 26px;
    background: rgba(168,85,247,0.14);
    border: 1px solid rgba(168,85,247,0.5);
    border-radius: 100px;
    color: var(--purple-light);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px; letter-spacing: 2.5px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
    animation: replayCtaIn 0.5s ease-out;
}
.replay-cta.visible { display: inline-flex; }
.replay-cta:hover {
    background: rgba(168,85,247,0.22);
    border-color: var(--purple); color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(168,85,247,0.4);
}
.replay-cta svg { width: 16px; height: 16px; }
@keyframes replayCtaIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ---------- INPUT ---------- */
.input-row { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 25px auto; flex-wrap: wrap; }
.input-row textarea {
    width: clamp(260px, 50vw, 340px); height: 110px; padding: 12px;
    background: rgba(14,6,32,0.85); color: var(--text);
    border: 2px solid var(--border); border-radius: 10px;
    font-family: 'Manrope', sans-serif; font-size: 14px;
    resize: vertical; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.input-row textarea::placeholder { color: var(--text-faded); }
.input-row textarea:focus { border-color: var(--purple-light); box-shadow: 0 0 14px rgba(168,85,247,0.4); }
.input-buttons { display: flex; flex-direction: column; gap: 10px; }
.keep-pool-row { display: flex; justify-content: center; margin: -8px auto 16px; padding: 0 16px; }
.keep-pool { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 0.10em; color: var(--text-dim); user-select: none; padding: 8px 14px; border: 1px solid rgba(168,85,247,0.30); border-radius: 8px; background: rgba(168,85,247,0.06); transition: border-color .2s, background .2s, color .2s; }
.keep-pool:hover { border-color: var(--purple-light); background: rgba(168,85,247,0.12); color: var(--text); }
.keep-pool input { accent-color: var(--purple); width: 16px; height: 16px; cursor: pointer; margin: 0; }
.win-count { display: inline-block; margin-left: 6px; padding: 2px 8px; font-size: 11px; font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.08em; color: #fff; background: var(--purple); border-radius: 999px; vertical-align: middle; box-shadow: 0 0 10px rgba(168,85,247,0.55); }
.btn {
    padding: 12px 22px;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    border: 1px solid rgba(0,0,0,0.3);
    color: white;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px; letter-spacing: 2px;
    border-radius: 100px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(168,85,247,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.1s, box-shadow 0.2s, filter 0.2s;
    text-transform: uppercase;
}
.btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(168,85,247,0.6), inset 0 1px 0 rgba(255,255,255,0.3);
    filter: brightness(1.1);
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.ghost {
    background: transparent;
    border: 1px solid var(--purple);
    color: var(--purple-light);
    box-shadow: 0 0 8px rgba(168,85,247,0.15);
}
.btn.ghost:hover:not(:disabled) { background: rgba(168,85,247,0.08); box-shadow: 0 0 15px rgba(168,85,247,0.4); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ---------- BOXES ---------- */
.boxes { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
.box {
    width: clamp(280px, 45vw, 340px);
    background: rgba(35,16,63,0.55);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 18px;
    backdrop-filter: blur(6px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}
.box h3 {
    font-family: 'Bebas Neue', sans-serif;
    margin: 0 0 14px;
    color: var(--gold-bright);
    font-size: 16px; letter-spacing: 0.2em;
    text-align: left;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: baseline;
    text-shadow: 0 0 8px rgba(251,191,36,0.4);
}
.box h3 .count {
    color: var(--pink-light);
    font-family: 'Anton', sans-serif;
    font-weight: 400; font-size: 16px;
    text-shadow: 0 0 8px var(--pink);
}
.list {
    background: rgba(0,0,0,0.4);
    padding: 12px 14px;
    min-height: 110px; max-height: 220px;
    overflow-y: auto;
    text-align: left; border-radius: 8px;
    font-family: 'Poppins', sans-serif; font-size: 15px;
    font-weight: 500; line-height: 1.7;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.05);
}
.list::-webkit-scrollbar { width: 6px; }
.list::-webkit-scrollbar-track { background: transparent; }
.list::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 3px; }
.list::-webkit-scrollbar-thumb:hover { background: var(--pink); }
.box-action { margin-top: 14px; text-align: center; }

@media (max-width: 680px) {
    .top-nav { padding: 12px 16px; }
    .back-home { font-size: 14px; padding: 4px 8px; }
    .back-home .label { display: none; }
    .wheel-wrapper { gap: 15px; }
    .applause-meter {
        order: 2;
        width: min(460px, 80vw);
        height: 80px;
    }
    .applause-meter .label { margin-bottom: 4px; }
    .bar-wrap { height: 28px; }
    .bar-wrap::before {
        background: repeating-linear-gradient(90deg, transparent 0, transparent 14px, rgba(255,255,255,0.06) 14px, rgba(255,255,255,0.06) 15px);
    }
    .bar-fill { height: 100%; width: 15%; top: 0; bottom: auto; border-radius: 4px; }
    .bar-value { margin-top: 4px; font-size: 18px; }
    .slot-container { order: 1; }
    .slot { width: min(480px, 84vw); height: 260px; }
    .slot .reel-item { height: 80px; line-height: 80px; font-size: 34px; }
    .slot .highlight { height: 80px; }
    .slot .ready { line-height: 260px; font-size: 36px; }
    .start-btn { padding: 16px 36px; font-size: 20px; }
}

/* TOAST */
.toast {
    position: fixed;
    top: 80px; left: 50%;
    transform: translateX(-50%) translateY(-30px);
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: white;
    padding: 14px 28px;
    border-radius: 100px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px; letter-spacing: 2px;
    border: 2px solid var(--gold-bright);
    box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 30px rgba(168,85,247,0.4);
    opacity: 0; pointer-events: none; z-index: 100;
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 90%; text-align: center; text-transform: uppercase;
}
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<script>
const I18N = {
    fr: {
        'meta.title':         'Prime Time Show — Spinfinity',
        'meta.description':   'Tirage au sort ambiance plateau télé : spots lumière, applausomètre, confettis multicolores et grand show pour vos soirées.',
        'nav.back':           'Retour à l\'accueil',
        'badge.live':         'ON AIR',
        'title.main':         'Prime Time',
        'subtitle':           'The show must go on',
        'meter.label':        'Applaus-o-mètre',
        'btn.start':          'Roulement de tambour',
        'btn.import':         'Import',
        'btn.reset':          'Reset',
        'btn.restore':        '↩ Renvoyer dans Candidats',
        'btn.importPrizes':   'Import Cadeaux',
        'btn.clear':          'Effacer',

        'ph.prizes':          'Liste des cadeaux (1 par ligne, dans l\'ordre de remise)',
        'title.winners':      '★ Gagnants',

        'title.prizes':       '★ Cadeaux',

        'noPrizes':           'aucun cadeau — mode classique',
        'next':               '← PROCHAIN',
        'ready':              'READY',
        'running':            'APPLAUSE!',
        'winner':             'WINNER!',
        'prize.label':        '🎉 ET LE GAGNANT EST',
        'audio.loading':      '🔊 Chargement applaudissements...',
        'audio.none':         'AUCUN APPLAUDISSEMENT',
        'audio.loaded':       'APPLAUDISSEMENT(S) CHARGÉ(S)',
        'confirm.reset':      'Tout effacer (candidats + gagnants) ?',
        'confirm.clearPrizes':'Effacer la liste des cadeaux ?',
        'toast.noNames':      'Aucun candidat — importez des noms d\'abord !',
    },
    en: {
        'meta.title':         'Prime Time Show — Spinfinity',
        'meta.description':   'TV stage random picker: spotlights, applause meter, multicolor confetti and a big show for your events.',
        'nav.back':           'Back to home',
        'badge.live':         'ON AIR',
        'title.main':         'Prime Time',
        'subtitle':           'The show must go on',
        'meter.label':        'Applause Meter',
        'btn.start':          'Drumroll please',
        'btn.import':         'Import',
        'btn.reset':          'Reset',
        'btn.restore':        '↩ Send back to Contestants',
        'btn.importPrizes':   'Import Gifts',
        'btn.clear':          'Clear',
        'btn.replay':         '📲 Video replay',
        'keepPool.label':     'Keep winners in the pool (draw with replacement)',
        'ph.names':           'Paste contestants here (one per line or comma-separated)',
        'ph.prizes':          'Gift list (1 per line, in award order)',
        'title.winners':      '★ Winners',
        'title.participants': '★ Contestants',
        'title.prizes':       '★ Gifts',
        'empty':              'empty',
        'noPrizes':           'no gifts — classic mode',
        'next':               '← NEXT',
        'ready':              'READY',
        'running':            'APPLAUSE!',
        'winner':             'WINNER!',
        'prize.label':        '🎉 AND THE WINNER IS',
        'audio.loading':      '🔊 Loading applause...',
        'audio.none':         'NO APPLAUSE SOUND',
        'audio.loaded':       'APPLAUSE(S) LOADED',
        'confirm.reset':      'Clear everything (contestants + winners)?',
        'confirm.clearPrizes':'Clear the gifts list?',
        'toast.noNames':      'No contestants — import names first!',
    }
};

let currentLang = 'fr';
const t = (key) => I18N[currentLang][key] ?? key;

function detectLanguage() {
    const urlLang = new URLSearchParams(location.search).get('lang');
    if (urlLang && I18N[urlLang]) return urlLang;
    const stored = localStorage.getItem('spinfinity-lang');
    if (stored && I18N[stored]) return stored;
    const nav = (navigator.language || 'fr').slice(0,2).toLowerCase();
    return I18N[nav] ? nav : 'fr';
}

function applyLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    localStorage.setItem('spinfinity-lang', lang);
    const dict = I18N[lang];

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const val = dict[el.dataset.i18n];
        if (val === undefined) return;
        const attr = el.dataset.i18nAttr;
        if (attr) el.setAttribute(attr, val);
        else el.textContent = val;
    });

    document.title = dict['meta.title'];
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });

    renderLists();
    updateAudioStatus();
    updateReadyText();
    updateBarValue();
}

let toastTimer = null;
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('visible');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('visible'), 3000);
}

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
});

(function initKeepWinnersToggle() {
    const cb = document.getElementById('keepWinners');
    if (!cb) return;
    const KEY = 'spinfinity-tvshow-keep-pool';
    cb.checked = localStorage.getItem(KEY) === '1';
    cb.addEventListener('change', () => {
        localStorage.setItem(KEY, cb.checked ? '1' : '0');
    });
})();

/* =========================================================
   STATE
========================================================= */
let names = [], winners = [], prizes = [];
let spinning = false, lastWinner = null, nameBag = [], lastServedName = null;
let lastDrawSnapshot = null;

const THEME_CONFIG = {
    slug: 'tvshow',
    display: 'Prime Time',
    subtitle: 'The show must go on',
    bg: '#1a0a2e',
    accent1: '#a855f7',
    accent2: '#ec4899',
    text: '#faf5ff',
    accent_text: '#fde047',
    font: '"Bebas Neue", sans-serif',
    titleShadow: '#a855f7',
    titleGradient: ['#fde047', '#ec4899', '#a855f7']
};
function showReplayButton() { document.getElementById('replayBtn')?.classList.add('visible'); }
function hideReplayButton() { document.getElementById('replayBtn')?.classList.remove('visible'); }
function openReplayModal() {
    if (!lastDrawSnapshot || !window.SpinfinityReplay) return;
    window.SpinfinityReplay.showReplayModal(THEME_CONFIG, lastDrawSnapshot.participants, lastDrawSnapshot.winner, lastDrawSnapshot.prize);
}

const slot      = document.getElementById("slot");
const reel      = document.getElementById("reel");
const list      = document.getElementById("list");
const winEl     = document.getElementById("winners");
const spinBtn   = document.getElementById("spinBtn");
const barFill   = document.getElementById("barFill");
const barValue  = document.getElementById("barValue");

const ITEM_H        = window.matchMedia('(max-width:680px)').matches ? 80 : 100;
const VIEWPORT_H    = window.matchMedia('(max-width:680px)').matches ? 260 : 320;
const CENTER_OFFSET = (VIEWPORT_H / 2) - (ITEM_H / 2);
const IDLE_SPEED    = 24;
const INITIAL_REPS  = 8;
const IS_MOBILE     = window.matchMedia('(max-width:680px)').matches;

let idleY = 0, idleRafId = null, idleLastTs = null, idleRunning = false, idleRestartId = null;

/* =========================================================
   APPLAUSE METER
========================================================= */
function setMeter(pct) {
    const p = Math.max(0, Math.min(1, pct));
    barFill.style.width = `${p*100}%`;
}
function updateBarValue() {
    barValue.textContent = spinning ? t('running') : (winners.length > 0 && names.length === 0 ? '★' : t('ready'));
}

/* =========================================================
   AUDIO
========================================================= */
let audioCtx = null, sharedAudio = null, applauseUrls = [], audioUnlocked = false, lastTickTime = 0;
const MIN_TICK_GAP = 0.065;
let audioStatus = { count: 0, names: [] };

function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function updateAudioStatus() {
    const el = document.getElementById('audio-status');
    if (audioStatus.count === 0) {
        el.innerHTML = '⚠ ' + t('audio.none');
        el.style.color = 'var(--pink-light)';
    } else {
        el.innerHTML = `🔊 ${audioStatus.count} ${t('audio.loaded')}: ${audioStatus.names.join(' | ')}`;
        el.style.color = '';
    }
}

async function discoverApplauseSounds() {
    const urls = [];
    try {
        const res = await fetch('sounds/list.json', { cache: 'no-store' });
        if (res.ok) {
            const lst = await res.json();
            if (Array.isArray(lst)) lst.forEach(n => urls.push(`sounds/${n}`));
        }
    } catch (e) {}
    if (urls.length === 0) {
        for (let i = 1; i <= 50; i++) {
            try {
                const res = await fetch(`sounds/${i}.mp3`, { method: 'GET', cache: 'no-store' });
                if (res.ok) urls.push(`sounds/${i}.mp3`);
                else break;
            } catch (e) { break; }
        }
    }
    applauseUrls = urls;
    audioStatus = { count: urls.length, names: urls.map(u => u.split('/').pop()) };
    updateAudioStatus();

    if (urls.length > 0) {
        sharedAudio = new Audio();
        sharedAudio.preload = 'none';
        sharedAudio.volume  = 0.8;
    }
}

function unlockAudio() {
    if (audioUnlocked || !sharedAudio || applauseUrls.length === 0) return;
    sharedAudio.src = applauseUrls[0]; sharedAudio.muted = true;
    const p = sharedAudio.play();
    if (p && p.then) p.then(() => { sharedAudio.pause(); sharedAudio.currentTime = 0; sharedAudio.muted = false; audioUnlocked = true; }).catch(() => {});
}

function playApplause() {
    if (!sharedAudio || applauseUrls.length === 0) {
        // Fallback: synth applause-ish noise burst
        if (!audioCtx) return;
        const t0 = audioCtx.currentTime;
        const dur = 1.5;
        const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
            const envelope = Math.min(1, i / (audioCtx.sampleRate * 0.1)) * Math.max(0, 1 - i / data.length);
            data[i] = (Math.random() * 2 - 1) * envelope * 0.3;
        }
        const noise = audioCtx.createBufferSource(); noise.buffer = buf;
        const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3000; bp.Q.value = 0.7;
        noise.connect(bp); bp.connect(audioCtx.destination);
        noise.start(t0);
        return;
    }
    const url = applauseUrls[Math.floor(Math.random() * applauseUrls.length)];
    try {
        sharedAudio.src = url; sharedAudio.currentTime = 0;
        const p = sharedAudio.play(); if (p && p.catch) p.catch(() => {});
    } catch (e) {}
}

function playTick() {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    if (t0 - lastTickTime < MIN_TICK_GAP) return;
    lastTickTime = t0;
    const dur = 0.06;
    // Drum-like tick
    const o = audioCtx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(200, t0);
    o.frequency.exponentialRampToValueAtTime(80, t0 + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.09, t0 + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.01);
}

discoverApplauseSounds();

/* =========================================================
   NAME BAG
========================================================= */
function fisherYates(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function nextName(exclude = null) {
    if (names.length === 0) return '';
    const pool = exclude ? names.filter(n => n !== exclude) : names;
    if (pool.length === 0) return names[0];
    if (pool.length === 1) return pool[0];
    nameBag = nameBag.filter(n => pool.includes(n));
    if (nameBag.length === 0) {
        nameBag = fisherYates(pool);
        if (nameBag[0] === lastServedName && nameBag.length > 1) {
            const j = 1 + Math.floor(Math.random() * (nameBag.length - 1));
            [nameBag[0], nameBag[j]] = [nameBag[j], nameBag[0]];
        }
    }
    const n = nameBag.shift();
    lastServedName = n;
    return n;
}

/* =========================================================
   LISTS
========================================================= */
function renderLists() {
    document.getElementById('winnersTitle').innerHTML = `${t('title.winners')} <span class="count">${winners.length}</span>`;
    document.getElementById('listTitle').innerHTML    = `${t('title.participants')} <span class="count">${names.length}</span>`;
    document.getElementById('prizesTitle').innerHTML  = `${t('title.prizes')} <span class="count">${prizes.length}</span>`;

    list.innerHTML = names.length ? names.join("<br>") : `<i style='opacity:.4'>${t('empty')}</i>`;

    if (winners.length === 0) {
        winEl.innerHTML = `<i style='opacity:.4'>${t('empty')}</i>`;
    } else {
        winEl.innerHTML = winners.map((w, i) => {
            const p = prizes[i];
            const count = winners.slice(0, i + 1).filter(x => x === w).length;
            const badge = count > 1 ? ` <span class="win-count">×${count} 🏆</span>` : '';
            const base = p ? `${w} → 🎁 <strong style="color:var(--gold-bright)">${p}</strong>` : w;
            return base + badge;
        }).join("<br>");
    }

    const prizesEl = document.getElementById('prizesList');
    if (prizesEl) {
        if (prizes.length === 0) {
            prizesEl.innerHTML = `<i style='opacity:.4'>${t('noPrizes')}</i>`;
        } else {
            prizesEl.innerHTML = prizes.map((p, i) => {
                if (i < winners.length) {
                    return `<span style="opacity:.45; text-decoration: line-through;">${i + 1}. ${p}</span> → ${winners[i]} ✓`;
                } else if (i === winners.length) {
                    return `<strong style="color:var(--pink-light)">${i + 1}. ${p}</strong> <span style="color:var(--pink-light); font-size:11px;">${t('next')}</span>`;
                } else {
                    return `${i + 1}. ${p}`;
                }
            }).join("<br>");
        }
    }

    updateBarValue();
}

/* =========================================================
   IDLE
========================================================= */
function showReadyEmpty() {
    stopIdle();
    reel.style.transform = "translateY(0)";
    reel.innerHTML = `<div class="reel-item ready">${t('ready')}</div>`;
    slot.classList.remove("winner-glow", "spinning");
}
function updateReadyText() {
    const readyEl = reel.querySelector('.ready');
    if (readyEl) readyEl.textContent = t('ready');
}
function appendIdleItems(count) {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
        const d = document.createElement('div'); d.className = 'reel-item';
        d.textContent = nextName(); frag.appendChild(d);
    }
    reel.appendChild(frag);
}
function startIdleFresh() {
    stopIdle();
    if (names.length === 0) { showReadyEmpty(); return; }
    slot.classList.remove("winner-glow", "spinning");
    reel.innerHTML = '';
    appendIdleItems(names.length * INITIAL_REPS);
    idleY = 0; reel.style.transform = `translateY(${idleY}px)`;
    runIdleLoop();
}
function resumeIdle() {
    if (names.length === 0) { showReadyEmpty(); return; }
    slot.classList.remove("winner-glow", "spinning");
    runIdleLoop();
}
function runIdleLoop() {
    idleRunning = true; idleLastTs = null;
    function step(ts) {
        if (!idleRunning) return;
        if (!idleLastTs) idleLastTs = ts;
        const dt = (ts - idleLastTs) / 1000; idleLastTs = ts;
        idleY -= IDLE_SPEED * dt;
        const totalH = reel.children.length * ITEM_H;
        if (totalH + idleY < VIEWPORT_H + ITEM_H * 8) appendIdleItems(names.length * 2);
        const itemsAboveTop = Math.floor(-idleY / ITEM_H);
        if (itemsAboveTop > 80) {
            const remove = 40;
            for (let i = 0; i < remove; i++) reel.removeChild(reel.firstChild);
            idleY += remove * ITEM_H;
        }
        reel.style.transform = `translateY(${idleY}px)`;
        idleRafId = requestAnimationFrame(step);
    }
    idleRafId = requestAnimationFrame(step);
}
function stopIdle() {
    idleRunning = false;
    if (idleRafId) { cancelAnimationFrame(idleRafId); idleRafId = null; }
    idleLastTs = null;
}
function cancelIdleRestart() {
    if (idleRestartId) { clearTimeout(idleRestartId); idleRestartId = null; }
}

/* =========================================================
   PARTICLES — stars + colorful confetti
========================================================= */
const smokeCanvas = document.getElementById('smoke-canvas');
const smokeCtx = smokeCanvas.getContext('2d');
let smokeParticles = [], smokeActive = false, smokeRafId = null;

function resizeSmoke() { smokeCanvas.width = window.innerWidth; smokeCanvas.height = window.innerHeight; }
resizeSmoke(); window.addEventListener('resize', resizeSmoke);

const TVSHOW_COLORS = ['#a855f7','#c084fc','#ec4899','#f472b6','#fbbf24','#fde047','#ffffff'];

function drawStar(ctx, x, y, r, points, inset) {
    ctx.beginPath();
    ctx.moveTo(0, -r);
    for (let i = 0; i < points; i++) {
        ctx.rotate(Math.PI / points);
        ctx.lineTo(0, -(r * inset));
        ctx.rotate(Math.PI / points);
        ctx.lineTo(0, -r);
    }
    ctx.closePath();
}

function emitStageParticles(intensity) {
    const rect = slot.getBoundingClientRect();
    const centerY = rect.top + rect.height / 2;
    const count = Math.floor(intensity * 4) + 2;
    for (let i = 0; i < count; i++) {
        const fromLeft = Math.random() < 0.5;
        const x = fromLeft ? rect.left - 5 : rect.right + 5;
        const vxDir = fromLeft ? 1 : -1;
        const isStar = Math.random() < 0.3;
        smokeParticles.push({
            x: x,
            y: centerY + (Math.random()-0.5) * rect.height * 0.6,
            vx: vxDir * (3 + Math.random()*6) * intensity,
            vy: -1 - Math.random()*2,
            size: isStar ? (8 + Math.random()*6) : (4 + Math.random()*5),
            life: 1,
            decay: 0.006 + Math.random()*0.008,
            rot: Math.random()*Math.PI*2,
            rotV: (Math.random()-0.5) * 0.25,
            color: TVSHOW_COLORS[Math.floor(Math.random()*TVSHOW_COLORS.length)],
            type: isStar ? 'star' : 'confetti'
        });
    }
}

function updateSmoke() {
    smokeCtx.clearRect(0, 0, smokeCanvas.width, smokeCanvas.height);
    for (let i = smokeParticles.length - 1; i >= 0; i--) {
        const p = smokeParticles[i];
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.985; p.vy += 0.12;
        p.life -= p.decay;
        p.rot += p.rotV;
        if (p.life <= 0 || p.y > smokeCanvas.height + 50) { smokeParticles.splice(i, 1); continue; }
        const alpha = Math.min(1, p.life * 1.2);
        smokeCtx.save();
        smokeCtx.translate(p.x, p.y);
        smokeCtx.rotate(p.rot);
        smokeCtx.globalAlpha = alpha;
        smokeCtx.fillStyle = p.color;
        if (p.type === 'star') {
            drawStar(smokeCtx, 0, 0, p.size, 5, 0.5);
            smokeCtx.fill();
            // glow
            smokeCtx.globalAlpha = alpha * 0.4;
            smokeCtx.shadowColor = p.color;
            smokeCtx.shadowBlur = 10;
            drawStar(smokeCtx, 0, 0, p.size*1.2, 5, 0.5);
            smokeCtx.fill();
        } else {
            smokeCtx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.5);
        }
        smokeCtx.restore();
    }
    if (smokeParticles.length > 0 || smokeActive) smokeRafId = requestAnimationFrame(updateSmoke);
    else smokeRafId = null;
}
function startSmokeLoop() { if (!smokeRafId) smokeRafId = requestAnimationFrame(updateSmoke); }

/* =========================================================
   PRIZE BANNER
========================================================= */
function showPrizeBanner(prize) {
    const banner = document.getElementById('prize-banner');
    document.getElementById('prizeName').textContent = prize;
    banner.classList.remove('fading'); banner.classList.add('visible');
}
function hidePrizeBanner() {
    const banner = document.getElementById('prize-banner');
    if (!banner.classList.contains('visible')) return;
    banner.classList.remove('visible'); banner.classList.add('fading');
    setTimeout(() => banner.classList.remove('fading'), 1500);
}

/* =========================================================
   SPIN
========================================================= */
function spin() {
    if (spinning) return;
    if (names.length === 0) { showToast(t('toast.noNames')); return; }

    hidePrizeBanner();
    hideReplayButton();
    ensureAudio(); unlockAudio();
    cancelIdleRestart(); stopIdle();
    spinning = true; spinBtn.disabled = true;
    spinBtn.classList.add('active');
    slot.classList.remove("winner-glow"); slot.classList.add("spinning");
    barValue.textContent = t('running');

    const winnerIndex = Math.floor(Math.random() * names.length);
    const winner      = names[winnerIndex];

    const SCROLL_ITEMS = 50, BUFFER_AFTER = 8;
    const existingCount = reel.children.length;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < SCROLL_ITEMS; i++) {
        const d = document.createElement('div'); d.className = 'reel-item';
        d.textContent = nextName(winner); frag.appendChild(d);
    }
    const wd = document.createElement('div'); wd.className = 'reel-item winning'; wd.textContent = winner;
    frag.appendChild(wd);
    for (let i = 0; i < BUFFER_AFTER; i++) {
        const d = document.createElement('div'); d.className = 'reel-item';
        d.textContent = nextName(winner); frag.appendChild(d);
    }
    reel.appendChild(frag);

    const winnerItemIdx = existingCount + SCROLL_ITEMS;
    const startY = idleY;
    const finalY = -(winnerItemIdx * ITEM_H) + CENTER_OFFSET;
    const duration = 5200; let startTs = null;
    const easeOutQuint = t => 1 - Math.pow(1 - t, 5);
    let lastTickIdx = Math.round(-(startY - CENTER_OFFSET) / ITEM_H);

    smokeActive = false;

    function animate(ts) {
        if (!startTs) startTs = ts;
        const tt = Math.min((ts - startTs) / duration, 1);
        const eased = easeOutQuint(tt);
        const y = startY + (finalY - startY) * eased;
        reel.style.transform = `translateY(${y}px)`; idleY = y;
        // Applause meter builds tension
        const meterVal = 0.1 + eased * 0.6 + Math.random() * 0.1;
        setMeter(meterVal);
        const curIdx = Math.round(-(y - CENTER_OFFSET) / ITEM_H);
        if (curIdx !== lastTickIdx) { playTick(); lastTickIdx = curIdx; }
        if (tt < 1) requestAnimationFrame(animate);
        else {
            reel.style.transform = `translateY(${finalY}px)`; idleY = finalY;
            slot.classList.remove("spinning"); slot.classList.add("winner-glow");
            barValue.textContent = t('winner');
            // Max meter with little jiggle
            let jiggle = 0;
            const jiggleInt = setInterval(() => {
                setMeter(0.85 + Math.random() * 0.15);
                jiggle++;
                if (jiggle > 20) { clearInterval(jiggleInt); setMeter(1); }
            }, 60);
            // Stars + confetti from the sides
            smokeActive = true; startSmokeLoop();
            for (let k = 0; k < 18; k++) emitStageParticles(1.6);
            setTimeout(() => { smokeActive = false; }, 1000);
            const participantsSnapshot = [...names];
            const keepInPool = document.getElementById('keepWinners')?.checked;
            winners.push(winner);
            if (!keepInPool) names.splice(winnerIndex, 1);
            lastDrawSnapshot = { participants: participantsSnapshot, winner, prize: prizes[winners.length - 1] || null };
            renderLists(); lastWinner = winner;
            spinning = false; spinBtn.disabled = false; spinBtn.classList.remove('active');
            launchConfetti(); playApplause();
            showReplayButton();
            const prize = prizes[winners.length - 1];
            if (prize) showPrizeBanner(prize);
            idleRestartId = setTimeout(() => {
                idleRestartId = null;
                if (!spinning) { hidePrizeBanner(); setMeter(0); updateBarValue(); resumeIdle(); }
            }, 10000);
        }
    }
    requestAnimationFrame(animate);
}

/* =========================================================
   IMPORT / RESET / RESTORE / PRIZES
========================================================= */
function importNames() {
    const raw = document.getElementById("input").value;
    const arr = raw.split(/\n|,/).map(x => x.trim()).filter(x => x);
    if (arr.length === 0) return;
    names = names.concat(arr);
    document.getElementById("input").value = "";
    renderLists();
    if (!spinning && !slot.classList.contains("winner-glow") && !idleRunning) startIdleFresh();
}
function resetAll() {
    if (spinning) return;
    if (!confirm(t('confirm.reset'))) return;
    cancelIdleRestart(); stopIdle();
    names = []; winners = []; lastWinner = null; prizes = [];
    nameBag = []; lastServedName = null;
    lastDrawSnapshot = null; hideReplayButton();
    renderLists(); showReadyEmpty(); setMeter(0); updateBarValue();
}
function restoreWinners() {
    if (spinning || winners.length === 0) return;
    cancelIdleRestart();
    const toAdd = winners.filter(w => !names.includes(w));
    names = names.concat(toAdd); winners = []; lastWinner = null;
    renderLists(); startIdleFresh();
}
function importPrizes() {
    const raw = document.getElementById('prizes-input').value;
    const arr = raw.split(/\n/).map(x => x.trim()).filter(x => x);
    if (arr.length === 0) return;
    prizes = prizes.concat(arr);
    document.getElementById('prizes-input').value = "";
    renderLists();
}
function clearPrizes() {
    if (spinning) return;
    if (!confirm(t('confirm.clearPrizes'))) return;
    prizes = []; renderLists();
}

/* =========================================================
   CONFETTI — star+rect
========================================================= */
function launchConfetti() {
    const canvas = document.createElement('canvas');
    canvas.id = 'confetti-canvas';
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const colors = TVSHOW_COLORS;
    const particles = [];
    function burst(x, y, cnt) {
        for (let i = 0; i < cnt; i++) {
            const angle = Math.random()*Math.PI*2; const speed = Math.random()*8+2;
            particles.push({
                x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 2,
                color: colors[Math.floor(Math.random()*colors.length)],
                size: Math.random()*5+3, life: 1,
                decay: 0.006+Math.random()*0.010,
                shape: Math.random()<0.35?'star':(Math.random()<0.5?'rect':'circle'),
                angle: Math.random()*Math.PI*2, spin: (Math.random()-0.5)*0.35
            });
        }
    }
    const W = canvas.width, H = canvas.height;
    burst(W*0.5, H*0.4, 80);
    setTimeout(() => burst(W*0.25, H*0.35, 50), 200);
    setTimeout(() => burst(W*0.75, H*0.35, 50), 400);
    setTimeout(() => burst(W*0.5, H*0.25, 40), 700);

    for (let i = 0; i < 100; i++) {
        particles.push({
            x: Math.random()*W, y: -20-Math.random()*200,
            vx: (Math.random()-0.5)*3, vy: Math.random()*2+1,
            color: colors[Math.floor(Math.random()*colors.length)],
            size: Math.random()*5+3, life: 1, decay: 0.003,
            shape: Math.random()<0.3?'star':'rect', angle: Math.random()*Math.PI*2, spin: (Math.random()-0.5)*0.28
        });
    }
    let frames = 0;
    function frame() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.vy += 0.13; p.vx *= 0.995; p.x += p.vx; p.y += p.vy;
            p.angle += p.spin; p.life -= p.decay;
            if (p.life <= 0 || p.y > canvas.height + 40) { particles.splice(i,1); continue; }
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
            ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
            if (p.shape === 'rect') ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.55);
            else if (p.shape === 'star') { drawStar(ctx, 0, 0, p.size, 5, 0.5); ctx.fill(); }
            else { ctx.beginPath(); ctx.arc(0, 0, p.size*0.55, 0, Math.PI*2); ctx.fill(); }
            ctx.restore();
        }
        frames++;
        if (particles.length > 0 && frames < 650) requestAnimationFrame(frame);
        else canvas.remove();
    }
    requestAnimationFrame(frame);
}

/* =========================================================
   INIT
========================================================= */
applyLanguage(detectLanguage());
renderLists();
if (names.length > 0) startIdleFresh();
else showReadyEmpty();
setMeter(0);
</script>
